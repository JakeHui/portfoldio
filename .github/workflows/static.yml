name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble website
        run: |
          mkdir -p _site
          cp *.html *.css *.js .nojekyll _site/
          cat assets.zip.001 assets.zip.002 assets.zip.003 > /tmp/portfolio-assets.zip
          unzip -q /tmp/portfolio-assets.zip -d _site
          test -f _site/assets/decode-v2-photo.jpg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
